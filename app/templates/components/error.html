<div class="error-state">

    <div class="error-icon">
        <span class="icon icon-alert"></span>
    </div>

    <h3>
        Terjadi kesalahan
    </h3>

    <p>
        {{ message | default(
            "Data tidak dapat dimuat. Silakan coba lagi."
        ) }}
    </p>

    {% if retry %}
        <button
            type="button"
            class="button button-outline button-md"
            data-retry
        >
            Coba Lagi
        </button>
    {% endif %}

</div>
