<nav
    class="breadcrumb"
    aria-label="Breadcrumb"
>
    {% for item in breadcrumb %}
        {% if not loop.last %}
            <a
                href="{{ item.url }}"
                class="breadcrumb-link"
            >
                {{ item.label }}
            </a>

            <span class="breadcrumb-separator">
                /
            </span>
        {% else %}
            <span
                class="breadcrumb-current"
                aria-current="page"
            >
                {{ item.label }}
            </span>
        {% endif %}
    {% endfor %}
</nav>
