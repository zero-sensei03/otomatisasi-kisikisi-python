{% extends "layouts/base.html" %}
{% block title %}Edit Generation{% endblock %}
{% block topbar_title %}Edit Generation{% endblock %}
{% block content %}
<div class="page-header"><div class="page-header-content"><div class="page-header-heading"><div class="breadcrumbs"><a href="/generation">Generation AI</a><span>/</span><a href="/generation/{{ generation.id }}">{{ generation.title }}</a><span>/</span><span>Edit</span></div><h1>Edit Informasi Materi</h1><p>Perbarui judul dan deskripsi generation.</p></div></div></div>
<form class="card generation-form" method="post" action="/generation/{{ generation.id }}/edit"><input type="hidden" name="csrf_token" value="{{ csrf.csrf_token }}"><input type="hidden" name="csrf_signature" value="{{ csrf.csrf_signature }}"><div class="card-body"><div class="form-group"><label class="form-label">Judul Materi</label><input class="form-input" name="title" maxlength="255" required value="{{ generation.title }}"></div><div class="form-grid"><div class="form-group"><label class="form-label">Mata Pelajaran</label><input class="form-input" name="subject" required value="{{ generation.subject }}"></div><div class="form-group"><label class="form-label">Kelas</label><input class="form-input" name="class_name" required value="{{ generation.class_name }}"></div></div><div class="form-group"><label class="form-label">Deskripsi</label><textarea class="form-textarea" name="description" rows="5">{{ generation.description or '' }}</textarea></div><div class="form-actions"><a class="button button-outline" href="/generation/{{ generation.id }}">Batal</a><button class="button button-primary" type="submit">Simpan Perubahan</button></div></div></form>
{% endblock %}
