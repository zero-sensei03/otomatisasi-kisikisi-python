{% extends "base.html" %}

{% block title %}
Tambah Guru
{% endblock %}

{% block content %}

<div class="page">

    <div class="page-header">

        <div class="page-header-content">

            <span class="page-eyebrow">
                ADMINISTRATION
            </span>

            <h1 class="page-title">
                Tambah Guru
            </h1>

            <p class="page-description">
                Membuat akun pengguna sekaligus profil guru.
            </p>

        </div>

    </div>

    <div class="card">

        <div class="card-header">

            <div class="card-header-content">

                <h2 class="card-title">
                    Informasi Guru
                </h2>

                <p class="card-description">
                    Lengkapi informasi akun dan profil guru.
                </p>

            </div>

        </div>

        {% if error %}

        <div style="padding: 1.25rem 1.5rem 0;">

            <div class="alert alert-error">
                {{ error }}
            </div>

        </div>

        {% endif %}

        <div style="padding: 1.5rem;">

            <form
                method="post"
                action="/users/create"
                class="form loading-form"
            >

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token }}"
                >

                <div class="form-group">

                    <label for="full_name">
                        Nama Lengkap
                    </label>

                    <input
                        id="full_name"
                        name="full_name"
                        type="text"
                        value="{{ form.full_name if form else '' }}"
                        placeholder="Masukkan nama lengkap"
                        autocomplete="name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        value="{{ form.username if form else '' }}"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        value="{{ form.email if form else '' }}"
                        placeholder="Masukkan alamat email"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="employee_number">
                        Nomor Pegawai
                    </label>

                    <input
                        id="employee_number"
                        name="employee_number"
                        type="text"
                        value="{{ form.employee_number if form else '' }}"
                        placeholder="Masukkan nomor pegawai"
                    >

                    <small class="muted">
                        Opsional.
                    </small>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        minlength="8"
                        placeholder="Minimal 8 karakter"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <div
                    style="
                        display: flex;
                        align-items: center;
                        justify-content: flex-end;
                        gap: 0.75rem;
                        margin-top: 1.5rem;
                        padding-top: 1.5rem;
                        border-top: 1px solid var(--color-border);
                    "
                >

                    <a
                        href="/users"
                        class="button button-outline"
                    >
                        Batal
                    </a>

                    <button
                        type="submit"
                        class="button button-primary loading-button"
                    >
                        <span class="button-spinner"></span>

                        <span class="button-text">
                            Simpan Guru
                        </span>
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
